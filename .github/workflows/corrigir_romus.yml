name: Corrigir ROMUS
on:
  push:
    paths:
      - '.github/workflows/corrigir_romus.yml'
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcoes
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py')
          text=p.read_text(encoding='utf-8')
          start=text.index('def resposta_local_deterministica')
          end=text.index('\ndef obter_client',start)
          nova='''def resposta_local_deterministica(pergunta: str, resultados: list[dict]) -> str | None:
    if not resultados:
        return None
    refs=extrair_referencias(pergunta)
    termos=set(normalizar(pergunta))
    if intencao_documental(pergunta)=='decreto':
        for item in resultados:
            if re.search(r'\\b69[.]118(?:[/.-]24|[/.-]2024)?\\b',item['texto'],flags=re.I):
                return '69.118/2024'
    if pedido_literal(pergunta):
        numero=extrair_numero_item(pergunta)
        if numero:
            for item in resultados:
                trecho=extrair_item_literal(item['texto'],numero)
                if trecho: return trecho
    prioridades=termos | ({'largura','saida','saidas','emergencia','unidade','passagem','porta','portas','minima','minimo'} if refs['it'] else set())
    candidatos=[]; vistos=set()
    for item in resultados:
        linhas=[re.sub(r'\\s+',' ',x).strip(' -\\t') for x in re.split(r'\\n+',item['texto'])]
        for idx,linha in enumerate(linhas):
            if len(linha)<12 or linha.lower() in vistos: continue
            vistos.add(linha.lower())
            lt=set(normalizar(linha)); coinc=len(prioridades & lt)
            score=item['score']+coinc*10+(8 if re.search(r'\\d',linha) else 0)
            if len(lt)<=4: score-=20
            if coinc>=2: candidatos.append((score,linhas,idx))
    if candidatos:
        candidatos.sort(key=lambda x:x[0],reverse=True)
        _,linhas,idx=candidatos[0]
        return ' '.join(x for x in linhas[max(0,idx-1):min(len(linhas),idx+3)] if x)
    return resultados[0]['texto'][:1800].strip()
'''
          text=text[:start]+nova+text[end:]
          start=text.index('if perguntar and pergunta.strip():')
          novo='''if perguntar and pergunta.strip():
    pergunta=pergunta.strip()
    with st.spinner('Localizando o documento correto...'):
        assinatura=assinatura_base()
        catalogo=listar_arquivos(assinatura)
        candidatos=selecionar_arquivos(pergunta,catalogo)
    with st.spinner('Localizando o trecho correto...'):
        documentos=carregar_selecionados(candidatos)
        resultados=buscar_base(pergunta,documentos)
    st.caption('Fonte: base local do ROMUS.IA')
    direta=resposta_local_deterministica(pergunta,resultados)
    if direta and not pergunta_pede_calculo(pergunta):
        st.markdown('### ROMUS.IA'); st.write(direta); mostrar_fontes(resultados); st.stop()
    client=obter_client()
    if resultados and client is not None:
        with st.spinner('Sintetizando somente o necessario...'):
            try:
                resposta=gerar_resposta_local(client,pergunta,resultados)
                texto=(resposta.text or '').strip()
            except Exception as exc:
                texto=f'ERRO_GEMINI: {exc}'
        if texto and texto!=LIMITE_INSUFICIENTE and not texto.startswith('ERRO_GEMINI:'):
            st.markdown('### ROMUS.IA'); st.write(texto); mostrar_fontes(resultados); st.stop()
        if texto.startswith('ERRO_GEMINI:'):
            st.markdown('### ROMUS.IA')
            st.warning('O Gemini esta indisponivel. A base local continua funcionando.')
            st.write(direta or resultados[0]['texto'])
            mostrar_fontes(resultados); st.stop()
        if texto==LIMITE_INSUFICIENTE:
            resultados=[]
    if not resultados and web_habilitada and client is not None:
        with st.spinner('A base nao contem a resposta. Pesquisando na internet...'):
            try:
                resposta=gerar_resposta_web(client,pergunta)
                texto=(resposta.text or '').strip()
            except Exception as exc:
                texto=f'ERRO_WEB: {exc}'
        if texto and not texto.startswith('ERRO_WEB:'):
            st.caption('Fonte: pesquisa na internet (base local insuficiente)')
            st.markdown('### ROMUS.IA'); st.write(texto); st.stop()
    st.markdown('### ROMUS.IA')
    if resultados:
        st.warning('A base contem informacao relacionada, mas nao foi possivel produzir uma sintese segura.')
        st.write(resultados[0]['texto'])
    else:
        st.warning('A base local nao contem informacao suficiente para responder com seguranca.')
    mostrar_fontes(resultados)
'''
          text=text[:start]+novo+'\n'
          compile(text,'app.py','exec')
          p.write_text(text,encoding='utf-8')
      - name: Commitar
        run: |
          git config user.name 'ROMUS Bot'
          git config user.email 'romus-bot@users.noreply.github.com'
          git add app.py
          git commit -m 'Corrigir prioridade da base local e fallback' || exit 0
          git push
