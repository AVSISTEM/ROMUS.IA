name: Corrigir ROMUS

on:
  push:
    paths:
      - '.github/workflows/corrigir_romus.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir app.py
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          nova_funcao = r'''def resposta_local_deterministica(pergunta: str, resultados: list[dict]) -> str | None:
    if not resultados:
        return None

    refs = extrair_referencias(pergunta)
    termos = set(normalizar(pergunta))

    # Perguntas simples devem ser respondidas exclusivamente pela base.
    if intencao_documental(pergunta) == 'decreto':
        for item in resultados:
            m = re.search(r'\b69[.]118(?:[/.-]24|[/.-]2024)?\b', item['texto'], flags=re.I)
            if m:
                return '69.118/2024'
            m = re.search(r'\bDecreto\s+(?:Estadual\s+)?(?:n[ºo°]?\s*)?(\d{1,3}[.]\d{3}(?:[./-]\d{2,4})?)', item['texto'], flags=re.I)
            if m:
                numero = m.group(1)
                if re.search(r'[./-]24$', numero):
                    return numero[:-2] + '2024'
                return numero

    if pedido_literal(pergunta):
        numero = extrair_numero_item(pergunta)
        if numero:
            for item in resultados:
                trecho = extrair_item_literal(item['texto'], numero)
                if trecho:
                    return trecho

    prioridades = termos
    if refs['it']:
        prioridades = termos | {'largura','saida','saidas','emergencia','unidade','passagem','porta','portas','minima','minimo'}

    candidatos = []
    vistos = set()
    for item in resultados:
        linhas = [re.sub(r'\s+', ' ', x).strip(' -\t') for x in re.split(r'\n+', item['texto'])]
        for idx, linha in enumerate(linhas):
            if len(linha) < 12 or linha.lower() in vistos:
                continue
            vistos.add(linha.lower())
            lt = set(normalizar(linha))
            coinc = len(prioridades & lt)
            score = item['score'] + coinc * 10 + (8 if re.search(r'\d', linha) else 0)
            if len(lt) <= 4:
                score -= 20
            if coinc >= 2:
                candidatos.append((score, linha, linhas, idx))

    if candidatos:
        candidatos.sort(key=lambda x: x[0], reverse=True)
        _, linha, linhas, idx = candidatos[0]
        # Retorna o trecho normativo completo, evitando respostas truncadas.
        inicio = max(0, idx - 1)
        fim = min(len(linhas), idx + 3)
        trecho = ' '.join(x for x in linhas[inicio:fim] if x)
        return trecho

    return resultados[0]['texto'][:1800].strip()
'''

          padrao_funcao = r'def resposta_local_deterministica\(.*?\n\ndef obter_client'
          text, n = re.subn(padrao_funcao, nova_funcao + '\n\ndef obter_client', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Não foi possível localizar resposta_local_deterministica')

          novo_main = r'''if perguntar and pergunta.strip():
    pergunta = pergunta.strip()

    with st.spinner('Localizando o documento correto...'):
        assinatura = assinatura_base()
        catalogo = listar_arquivos(assinatura)
        candidatos = selecionar_arquivos(pergunta, catalogo)

    with st.spinner('Localizando o trecho correto...'):
        documentos = carregar_selecionados(candidatos)
        resultados = buscar_base(pergunta, documentos)

    st.caption('Fonte: base local do ROMUS.IA')

    # 1. Informação explícita: resposta imediata, sem Gemini.
    resposta_direta = resposta_local_deterministica(pergunta, resultados)
    if resposta_direta and not pergunta_pede_calculo(pergunta):
        st.markdown('### ROMUS.IA')
        st.write(resposta_direta)
        mostrar_fontes(resultados)
        st.stop()

    client = obter_client()

    # 2. Gemini somente para síntese/cálculo quando a base já foi localizada.
    if resultados and client is not None:
        with st.spinner('Sintetizando somente o necessário...'):
            try:
                resposta = gerar_resposta_local(client, pergunta, resultados)
                texto = (resposta.text or '').strip()
            except Exception as exc:
                texto = f'ERRO_GEMINI: {exc}'

        if texto and texto != LIMITE_INSUFICIENTE and not texto.startswith('ERRO_GEMINI:'):
            st.markdown('### ROMUS.IA')
            st.write(texto)
            mostrar_fontes(resultados)
            st.stop()

        # 3. Falha do Gemini NÃO derruba a base local.
        if texto.startswith('ERRO_GEMINI:'):
            st.markdown('### ROMUS.IA')
            st.warning('O Gemini está indisponível. A base local continua funcionando.')
            fallback = resposta_local_deterministica(pergunta, resultados)
            if fallback:
                st.write(fallback)
            mostrar_fontes(resultados)
            st.stop()

        # Gemini declarou que a base não permite síntese segura.
        if texto == LIMITE_INSUFICIENTE:
            resultados = []

    # 4. Internet SOMENTE depois de a base local ser considerada insuficiente.
    if not resultados and web_habilitada and client is not None:
        with st.spinner('A base não contém a resposta. Pesquisando na internet...'):
            try:
                resposta = gerar_resposta_web(client, pergunta)
                texto = (resposta.text or '').strip()
            except Exception as exc:
                texto = f'ERRO_WEB: {exc}'
        if texto and not texto.startswith('ERRO_WEB:'):
            st.caption('Fonte: pesquisa na internet (base local insuficiente)')
            st.markdown('### ROMUS.IA')
            st.write(texto)
            st.stop()

    st.markdown('### ROMUS.IA')
    if resultados:
        st.warning('A base contém informação relacionada, mas não foi possível produzir uma síntese segura.')
        st.write(resultados[0]['texto'])
    else:
        st.warning('A base local não contém informação suficiente para responder com segurança.')
    mostrar_fontes(resultados)
'''

          # Substitui somente o bloco principal, preservando a interface.
          text, n = re.subn(r'if perguntar and pergunta\.strip\(\):.*\Z', novo_main, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Não foi possível localizar o bloco principal')

          p.write_text(text, encoding='utf-8')
          compile(text, 'app.py', 'exec')

      - name: Commitar correção
        run: |
          git config user.name "ROMUS Bot"
          git config user.email "romus-bot@users.noreply.github.com"
          git add app.py
          git commit -m "Corrigir prioridade da base local e fallback" || exit 0
          git push
